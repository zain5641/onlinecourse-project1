<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Course</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Online Course</a>
        <div>
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.first_name }}</span>
                <a href="{% url 'onlinecourse:logout' %}" class="btn btn-outline-secondary btn-sm">Logout</a>
            {% else %}
                <a href="{% url 'onlinecourse:login' %}" class="btn btn-outline-primary btn-sm">Login</a>
                <a href="{% url 'onlinecourse:registration' %}" class="btn btn-outline-success btn-sm">Register</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
